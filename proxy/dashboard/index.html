<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llm-inspect</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #6366f1;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --blue: #3b82f6;
  }
  body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar { width: 420px; min-width: 280px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  #header h1 { font-size: 14px; font-weight: 600; color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ── Stats bar ── */
  #stats { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-size: 16px; font-weight: 600; }

  /* ── Request list ── */
  #request-list { flex: 1; overflow-y: auto; }
  .req-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
  .req-item:hover { background: var(--surface); }
  .req-item.selected { background: var(--surface); border-left: 2px solid var(--accent); }
  .req-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .provider-badge { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
  .badge-anthropic { background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed44; }
  .badge-openai { background: #16a34a22; color: #4ade80; border: 1px solid #16a34a44; }
  .req-model { color: var(--muted); font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req-status { width: 8px; height: 8px; border-radius: 50%; }
  .status-success { background: var(--green); }
  .status-error { background: var(--red); }
  .status-pending { background: var(--yellow); animation: pulse 1s infinite; }
  .req-bottom { display: flex; gap: 12px; color: var(--muted); font-size: 11px; }
  .req-cost { color: var(--green); }

  /* ── Detail panel ── */
  #detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #detail-header { padding: 16px; border-bottom: 1px solid var(--border); }
  #detail-header h2 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  #detail-meta { color: var(--muted); font-size: 11px; display: flex; gap: 16px; }
  #detail-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 8px; }
  .empty-state h2 { font-size: 14px; color: var(--text); }

  /* ── Message cards ── */
  .msg-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .msg-header { padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  .role-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .role-system   { background: #7c3aed22; color: #a78bfa; }
  .role-user     { background: #0369a122; color: #38bdf8; }
  .role-assistant{ background: #16a34a22; color: #4ade80; }
  .msg-tokens { margin-left: auto; color: var(--muted); font-size: 11px; }
  .token-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .token-bar { height: 100%; border-radius: 2px; transition: width .3s; }
  .bar-system    { background: #7c3aed; }
  .bar-user      { background: #0ea5e9; }
  .bar-assistant { background: #22c55e; }
  .msg-preview { padding: 10px 12px; color: var(--muted); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; }

  /* ── Summary card ── */
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; gap: 24px; flex-wrap: wrap; }
  .summary-stat { display: flex; flex-direction: column; gap: 2px; }
  .summary-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .summary-value { font-size: 18px; font-weight: 700; }

  /* ── Raw / Response cards ── */
  .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .section-header { padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); justify-content: space-between; }
  .section-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .label-raw      { color: #94a3b8; }
  .label-response { color: #4ade80; }
  .section-body { padding: 12px; font-size: 12px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .section-body--raw { color: #94a3b8; font-size: 11.5px; }
  .section-body--response { color: var(--text); }
  .json-key    { color: #7dd3fc; }
  .json-string { color: #86efac; }
  .json-number { color: #fb923c; }
  .json-bool   { color: #818cf8; }
  .json-null   { color: var(--muted); }
  .copy-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 3px 10px; border-radius: 4px; cursor: pointer; transition: all .15s; font-family: inherit; }
  .copy-btn:hover { color: var(--text); border-color: #4b5563; }
  .copy-btn--done { color: var(--green); border-color: var(--green); }
  .section-header { cursor: pointer; user-select: none; }
  .section-header:hover { background: rgba(255,255,255,.03); border-radius: 8px 8px 0 0; }
  .section-toggle { font-size: 10px; color: var(--muted); transition: transform .2s; display: inline-block; }
  .section-toggle--collapsed { transform: rotate(-90deg); }
  .section-actions { display: flex; align-items: center; gap: 8px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="header">
    <div class="dot"></div>
    <h1>llm-inspect</h1>
  </div>
  <div id="stats">
    <div class="stat">
      <span class="stat-label">Requests</span>
      <span class="stat-value" id="stat-count">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Total Tokens</span>
      <span class="stat-value" id="stat-tokens">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Total Cost</span>
      <span class="stat-value" id="stat-cost">$0.0000</span>
    </div>
  </div>
  <div id="request-list"></div>
</div>

<div id="detail">
  <div class="empty-state" id="empty-state">
    <h2>No request selected</h2>
    <p>Click a request to see message breakdown</p>
  </div>
  <div id="detail-content" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
    <div id="detail-header">
      <h2 id="detail-title"></h2>
      <div id="detail-meta"></div>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
