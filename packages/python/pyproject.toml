[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-inspect"
version = "0.1.0"
description = "Zero-config LLM API inspector — intercepts calls, shows token breakdown and cost estimates in a local dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["llm", "openai", "anthropic", "debugging", "tokens", "cost", "inspector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/kasidkhansbp/llm-inspect"

[tool.hatch.build.targets.wheel.force-include]
"../../proxy" = "llm_inspect/proxy"

[tool.hatch.build.targets.sdist]
include = ["llm_inspect/", "README.md"]
